name: Test Build SaVM EMSDK

on:
  push:
  pull_request:

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup NodeJS
        uses: actions/setup-node@v7

      - name: Setup Python
        uses: actions/setup-python@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          target: wasm32-unknown-emscripten

      - name: Setup & Build
        run: |
          bash ./setup.sh
          bash ./build.sh --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: saw
          archive: true
          compression-level: 9
          path: |
            ./target/wasm32-unknown-emscripten/release/saw.d.ts
            ./target/wasm32-unknown-emscripten/release/saw.js
            ./target/wasm32-unknown-emscripten/release/saw.wasm
